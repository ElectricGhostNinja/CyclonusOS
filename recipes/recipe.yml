# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: CyclonusOS
description: Bazzite with DankMaterialShell and Hyprland
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - add-nushell-repo.sh

  - from-file: repos-dms.yml
  - from-file: repos-common.yml
  - from-file: flatpaks.yml
